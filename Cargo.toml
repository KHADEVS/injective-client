[package]
name = "injective-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Khadim"]
description = "Build and sign Injective transactions in Rust, checked against Trust Wallet Core and the Injective testnet"
repository = "https://github.com/KHADEVS/injective-client"
readme = "README.md"
keywords = ["injective", "cosmos", "transaction", "trading", "signing"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[dependencies]
bech32 = "0.11"
k256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.13"
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
